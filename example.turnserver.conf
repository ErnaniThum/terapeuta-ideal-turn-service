# Listening ports
listening-port=3478
tls-listening-port=5349

# Your TURN server realm (should match your domain)
realm=terapeuta-ideal.com.br

# External IP (public IP of your server)
# external-ip=195.200.6.45

cli-ip=0.0.0.0
cli-port=5766
cli-password=REPLACE_WITH_A_SECURE_RANDOM_SECRET

# Authentication
lt-cred-mech
use-auth-secret
# static-auth-secret=REPLACE_WITH_A_SECURE_RANDOM_SECRET

cert=/etc/letsencrypt/live/terapeuta-ideal-turn/fullchain.pem
pkey=/etc/letsencrypt/live/terapeuta-ideal-turn/privkey.pem


# Logging
log-file=/var/log/turnserver/turn.log
# verbose
# simple-log

min-port=49152
max-port=65535

# Recommended options for better security and compatibility
no-loopback-peers
no-multicast-peers
stale-nonce=600
fingerprint